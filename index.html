<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ── Mock Data ──────────────────────────────────────────────────────────────

const researchers = [
  {
    name: "Dr. Sarah Chen",
    department: "Biomedical Engineering",
    notes: "Wearable biosensor development, point-of-care diagnostics, microfluidics integration"
  },
  {
    name: "Dr. Marcus Webb",
    department: "Oncology",
    notes: "Targeted drug delivery systems, lipid nanoparticle therapeutics, solid tumor models"
  },
  {
    name: "Dr. Priya Nair",
    department: "Bioinformatics",
    notes: "Genomic data pipelines, ML-based disease risk prediction, EHR data integration"
  }
];

const projects = [
  {
    name: "NanoDeliver Platform",
    overview: "Lipid nanoparticle-based drug delivery system optimized for solid tumor penetration and controlled release.",
    status: "Seeking Funding"
  },
  {
    name: "BioSense Patch",
    overview: "Flexible wearable patch for continuous real-time monitoring of glucose and lactate levels via enzymatic biosensors.",
    status: "Prototype"
  },
  {
    name: "GenomicRisk AI",
    overview: "EHR-integrated machine learning tool for early cancer risk scoring using multi-omic and clinical data inputs.",
    status: "Clinical Validation"
  }
];

const rfps = [
  {
    title: "Novel Antimicrobial Therapeutics",
    organization: "NIH SBIR",
    deadline: "Aug 15, 2026",
    budget: "$500K",
    focusArea: "Infectious Disease"
  },
  {
    title: "Digital Health Diagnostics Partnership",
    organization: "Roche",
    deadline: "Jul 1, 2026",
    budget: "$1.2M",
    focusArea: "Remote Monitoring"
  },
  {
    title: "Oncology Biomarker Discovery Program",
    organization: "AstraZeneca",
    deadline: "Sep 30, 2026",
    budget: "$800K",
    focusArea: "Early Cancer Detection"
  }
];

// ── Status Badge ───────────────────────────────────────────────────────────

const STATUS_STYLES = {
  "Idea Stage":         "bg-slate-100 text-slate-600 ring-slate-200",
  "Prototype":          "bg-amber-50 text-amber-700 ring-amber-200",
  "Seeking Funding":    "bg-blue-50 text-blue-700 ring-blue-200",
  "Clinical Validation":"bg-orange-50 text-orange-700 ring-orange-200",
  "Completed":          "bg-emerald-50 text-emerald-700 ring-emerald-200",
};

function StatusBadge({ status }) {
  const style = STATUS_STYLES[status] || STATUS_STYLES["Idea Stage"];
  return (
    <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ring-1 ring-inset ${style}`}>
      {status}
    </span>
  );
}

// ── Reusable Table ─────────────────────────────────────────────────────────

function DataTable({ columns, data }) {
  return (
    <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
      <table className="min-w-full divide-y divide-slate-200">
        <thead className="bg-slate-50">
          <tr>
            {columns.map(col => (
              <th
                key={col.key}
                className="px-5 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap"
              >
                {col.header}
              </th>
            ))}
          </tr>
        </thead>
        <tbody className="bg-white divide-y divide-slate-100">
          {data.map((row, i) => (
            <tr key={i} className="hover:bg-slate-50 transition-colors">
              {columns.map(col => (
                <td key={col.key} className="px-5 py-4 text-sm text-slate-700 align-top">
                  {col.render ? col.render(row[col.key], row) : row[col.key]}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── Tab Views ──────────────────────────────────────────────────────────────

function ResearcherProfiles() {
  const columns = [
    { key: "name",       header: "Researcher Name",   render: v => <span className="font-medium text-slate-900">{v}</span> },
    { key: "department", header: "Department" },
    { key: "notes",      header: "Notes / Interests",  render: v => <span className="text-slate-500">{v}</span> },
  ];
  return (
    <section>
      <div className="mb-6">
        <h2 className="text-xl font-semibold text-slate-900">Researcher Profiles</h2>
        <p className="mt-1 text-sm text-slate-500">Directory of active biomedical researchers and their focus areas.</p>
      </div>
      <DataTable columns={columns} data={researchers} />
    </section>
  );
}

function ProjectTracker() {
  const columns = [
    { key: "name",     header: "Project Name",  render: v => <span className="font-medium text-slate-900">{v}</span> },
    { key: "overview", header: "Overview",       render: v => <span className="text-slate-500 leading-relaxed">{v}</span> },
    { key: "status",   header: "Status",         render: v => <StatusBadge status={v} /> },
  ];
  return (
    <section>
      <div className="mb-6">
        <h2 className="text-xl font-semibold text-slate-900">Project Tracker</h2>
        <p className="mt-1 text-sm text-slate-500">Active healthcare commercialization projects and their current stage.</p>
      </div>
      <DataTable columns={columns} data={projects} />
      <div className="mt-4 flex flex-wrap gap-3">
        {Object.entries(STATUS_STYLES).map(([label, style]) => (
          <span key={label} className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ring-1 ring-inset ${style}`}>
            {label}
          </span>
        ))}
      </div>
    </section>
  );
}

function IndustryRFPs() {
  const columns = [
    { key: "title",        header: "Opportunity Title",  render: v => <span className="font-medium text-slate-900">{v}</span> },
    { key: "organization", header: "Organization",        render: v => <span className="font-medium text-indigo-600">{v}</span> },
    { key: "deadline",     header: "Deadline",            render: v => <span className="whitespace-nowrap">{v}</span> },
    { key: "budget",       header: "Budget Range",        render: v => <span className="font-medium text-emerald-700">{v}</span> },
    { key: "focusArea",    header: "Focus Area",          render: v => (
        <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 ring-1 ring-inset ring-indigo-200">
          {v}
        </span>
      )
    },
  ];
  return (
    <section>
      <div className="mb-6">
        <h2 className="text-xl font-semibold text-slate-900">Industry RFPs</h2>
        <p className="mt-1 text-sm text-slate-500">Open funding opportunities and partnership RFPs from biotech, pharma, and healthcare organizations.</p>
      </div>
      <DataTable columns={columns} data={rfps} />
    </section>
  );
}

// ── Sidebar ────────────────────────────────────────────────────────────────

const TABS = [
  {
    id: "researchers",
    label: "Researcher Profiles",
    icon: (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    )
  },
  {
    id: "projects",
    label: "Project Tracker",
    icon: (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
      </svg>
    )
  },
  {
    id: "rfps",
    label: "Industry RFPs",
    icon: (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
          d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    )
  }
];

function Sidebar({ activeTab, setActiveTab }) {
  return (
    <aside className="w-56 shrink-0 bg-white border-r border-slate-200 flex flex-col">
      <div className="px-5 py-5 border-b border-slate-100">
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center">
            <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
          </div>
          <span className="font-semibold text-slate-900 text-sm">ResearchHub</span>
        </div>
      </div>
      <nav className="flex-1 px-3 py-4 space-y-1">
        <p className="px-2 mb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Views</p>
        {TABS.map(tab => {
          const active = activeTab === tab.id;
          return (
            <button
              key={tab.id}
              onClick={() => setActiveTab(tab.id)}
              className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-left ${
                active
                  ? "bg-indigo-50 text-indigo-700"
                  : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
              }`}
            >
              <span className={active ? "text-indigo-600" : "text-slate-400"}>{tab.icon}</span>
              {tab.label}
            </button>
          );
        })}
      </nav>
      <div className="px-5 py-4 border-t border-slate-100">
        <p className="text-xs text-slate-400">Research Dashboard v0.1</p>
      </div>
    </aside>
  );
}

// ── App Root ───────────────────────────────────────────────────────────────

function App() {
  const [activeTab, setActiveTab] = useState("researchers");

  const currentTab = TABS.find(t => t.id === activeTab);

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
      <div className="flex-1 flex flex-col overflow-hidden">
        {/* Top bar */}
        <header className="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between shrink-0">
          <div className="flex items-center gap-2 text-sm text-slate-500">
            <span>Dashboard</span>
            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
            <span className="text-slate-900 font-medium">{currentTab?.label}</span>
          </div>
          <div className="flex items-center gap-2 text-xs text-slate-400">
            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            {new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}
          </div>
        </header>

        {/* Main content */}
        <main className="flex-1 overflow-y-auto px-8 py-8">
          {activeTab === "researchers" && <ResearcherProfiles />}
          {activeTab === "projects"    && <ProjectTracker />}
          {activeTab === "rfps"        && <IndustryRFPs />}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
